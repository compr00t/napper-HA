wake_up:
  name: Aufwachen
  description: Beendet das aktuell laufende Nickerchen oder den Nachtschlaf (nur möglich, wenn das Kind gerade schläft) – sofort oder mit Zeitdifferenz in der Vergangenheit.
  fields:
    baby_id:
      name: Kind (Baby-ID oder Name)
      description: Die Napper Baby-ID oder der Name des Kindes (z. B. "Max"). Wenn leer, wird das erste Kind verwendet.
      required: false
      example: "Max"
      selector:
        text:
    minutes_ago:
      name: Zeitdifferenz
      description: "0 = Jetzt sofort, > 0 = vor X Minuten aufgewacht (falls 0, wird die 'Zeitdifferenz'-Entität des Kindes verwendet)."
      required: false
      default: 0
      example: 10
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: "Min."
          mode: box

start_nap:
  name: Nickerchen starten
  description: Startet ein Nickerchen für ein Kind (nur möglich, wenn das Kind aktuell nicht schläft) – sofort oder mit Zeitdifferenz in der Vergangenheit.
  fields:
    baby_id:
      name: Kind (Baby-ID oder Name)
      description: Die Napper Baby-ID oder der Name des Kindes (z. B. "Max"). Wenn leer, wird das erste Kind verwendet.
      required: false
      example: "Max"
      selector:
        text:
    minutes_ago:
      name: Zeitdifferenz
      description: "0 = Jetzt sofort, > 0 = vor X Minuten gestartet (falls 0, wird die 'Zeitdifferenz'-Entität des Kindes verwendet)."
      required: false
      default: 0
      example: 15
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: "Min."
          mode: box

start_sleep:
  name: Schlafen starten
  description: Startet den Nachtschlaf für ein Kind (nur möglich, wenn das Kind aktuell nicht schläft) – sofort oder mit Zeitdifferenz in der Vergangenheit.
  fields:
    baby_id:
      name: Kind (Baby-ID oder Name)
      description: Die Napper Baby-ID oder der Name des Kindes (z. B. "Max"). Wenn leer, wird das erste Kind verwendet.
      required: false
      example: "Max"
      selector:
        text:
    minutes_ago:
      name: Zeitdifferenz
      description: "0 = Jetzt sofort, > 0 = vor X Minuten eingeschlafen (falls 0, wird die 'Zeitdifferenz'-Entität des Kindes verwendet)."
      required: false
      default: 0
      example: 20
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: "Min."
          mode: box
